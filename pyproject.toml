[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hikvision-console"
version = "0.1.2"
description = "Direct-to-NVR desktop surveillance over private networks"
license = "GPL-3.0-or-later"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["PySide6>=6.8,<7", "python-vlc>=3.0.21203", "httpx>=0.27,<1", "defusedxml>=0.7", "imageio-ffmpeg>=0.6"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-qt>=4", "ruff>=0.11", "pyinstaller>=6"]

[project.scripts]
hikvision-console = "hikvision_console.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/hikvision_console"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "scripts", "packaging", "assets", "docs", "artifacts/desktop-preview.png", "README.md", "THIRD_PARTY.md", "LICENSE", "pyproject.toml", "uv.lock", "run.sh", "run.ps1", ".github"]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"
addopts = "--basetemp=.tmp/pytest"

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
