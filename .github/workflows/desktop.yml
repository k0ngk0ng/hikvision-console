name: Desktop checks and builds
permissions:
  contents: read
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install VLC on macOS
        if: runner.os == 'macOS'
        run: brew install --cask vlc
      - name: Install VLC on Windows
        if: runner.os == 'Windows'
        run: choco install vlc --no-progress -y
      - name: Install VLC on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y vlc libvlc5 ffmpeg libxcb-cursor0 libxkbcommon-x11-0 xvfb xauth binutils
      - run: python -m pip install -e ".[dev]"
      - name: Behavioral tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q
      - run: python -m ruff check src tests scripts
      - name: Build desktop application
        run: python scripts/build.py
      - name: Native packaged playback test (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a python scripts/native_ci.py --frozen
      - name: Native packaged playback test (macOS / Windows)
        if: runner.os != 'Linux'
        run: python scripts/native_ci.py --frozen
      - name: Archive tested application
        run: python scripts/package_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: HikvisionConsole-${{ matrix.os }}-${{ runner.arch }}
          if-no-files-found: error
          path: |
            dist/*.zip
            dist/*.tar.gz
            dist/*.json
            dist/*.sha256
