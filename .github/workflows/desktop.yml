name: Desktop checks and builds
permissions:
  contents: read
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install VLC on macOS
        if: runner.os == 'macOS'
        run: brew install --cask vlc
      - name: Install VLC on Windows
        if: runner.os == 'Windows'
        run: choco install vlc --no-progress -y
      - name: Install VLC on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y vlc libvlc5 ffmpeg libxcb-cursor0 libxkbcommon-x11-0 xvfb xauth binutils
      - run: python -m pip install -e ".[dev]"
      - name: Behavioral tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q
      - run: python -m ruff check src tests scripts
      - name: Build desktop application
        run: python scripts/build.py
      - name: Native packaged playback test (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a python scripts/native_ci.py --frozen --verbose
      - name: Native packaged playback test (Windows)
        if: runner.os == 'Windows'
        run: python scripts/native_ci.py --frozen --verbose
      # Hosted macOS (ARM and Intel) has no CGL context for VLC. Do not report
      # component checks as native playback: manifests explicitly distinguish them.
      - name: Packaged component check (macOS; native rendering requires a real Mac)
        if: runner.os == 'macOS'
        run: python scripts/native_ci.py --frozen --components-only
      - name: Archive tested application
        if: runner.os != 'macOS'
        run: python scripts/package_release.py
      - name: Preserve native test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-diagnostics-${{ matrix.os }}
          path: .tmp/native-ci/self-test/
          include-hidden-files: true
      - name: Archive macOS build with component verification record
        if: runner.os == 'macOS'
        run: python scripts/package_release.py --components-only
      - uses: actions/upload-artifact@v4
        with:
          name: HikvisionConsole-${{ matrix.os }}-${{ runner.arch }}
          if-no-files-found: error
          path: |
            dist/*.zip
            dist/*.tar.gz
            dist/*.json
            dist/*.sha256
  release:
    name: Publish GitHub Release
    needs: desktop
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: HikvisionConsole-*
          merge-multiple: true
          path: release-assets
      - name: Verify release version and archive checksums
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import hashlib, json, os, re
          from pathlib import Path
          tag = os.environ['RELEASE_TAG']
          assert re.fullmatch(r'v\d+\.\d+\.\d+', tag), 'Expected vMAJOR.MINOR.PATCH tag'
          assert Path(f'docs/releases/{tag}.md').is_file(), 'Release notes are required'
          root = Path('release-assets')
          manifests = list(root.glob('*.json'))
          assert len(manifests) == 3, 'All three platform builds are required'
          platforms = set()
          expected_files = set()
          for path in manifests:
              data = json.loads(path.read_text())
              assert data['version'] == tag[1:], 'Tag and application version differ'
              assert data['verification']['passed'], 'Packaged application check failed'
              name = data['archive']
              assert Path(name).name == name, 'Invalid archive name'
              archive = root / name
              with archive.open('rb') as stream:
                  digest = hashlib.file_digest(stream, 'sha256').hexdigest()
              assert digest == data['sha256'], f'Checksum mismatch: {name}'
              checksum = path.with_suffix('.sha256')
              assert checksum.read_text().strip() == f'{digest}  {name}'
              expected_files.update((path.name, archive.name, checksum.name))
              platforms.add(data['system'])
          assert platforms == {'Darwin', 'Windows', 'Linux'}
          assert {p.name for p in root.iterdir()} == expected_files, 'Unexpected release files'
          PY
      - name: Create draft, upload verified assets, then publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" --verify-tag --draft \
            --title "Hikvision Console $RELEASE_TAG" \
            --notes-file "docs/releases/$RELEASE_TAG.md"
          gh release upload "$RELEASE_TAG" release-assets/*
          gh release edit "$RELEASE_TAG" --draft=false --latest
